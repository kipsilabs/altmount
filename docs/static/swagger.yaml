          type: integer
        type: array
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      timeout_seconds:
        type: integer
      url:
        type: string
      weight:
        type: integer
    type: object
  config.Par2RepairConfig:
    properties:
      arr_first:
        description: |-
          ArrFirst makes PAR2 repair the fallback for corrupted files: the health
          worker triggers the ARR rescan first exactly as before, and enqueues a
          PAR2 repair only when nothing is found in the ARRs (no instance
          configured, none tracks the file) or ARR repair is disabled. On by
          default; disable to keep PAR2 out of the corrupted-file flow (degraded
          files, playback holes and repair-on-import still repair via PAR2
          directly).
        type: boolean
      enabled:
        type: boolean
      max_concurrent_jobs:
        description: MaxConcurrentJobs bounds simultaneously running repair jobs.
        type: integer
      max_connections:
        description: |-
          MaxConnections bounds how many NNTP connections repair jobs use for
          article fetches (shared across concurrent jobs). Repair streams the
          whole release once, so this directly sets its download speed on an idle
          pool. Fetches ride the pool's background lane: while anything streams
          or imports, the pool holds repair to a quarter of each provider's
          connections regardless of this value. 0 (default) means 10.
        type: integer
      max_memory_mb:
        description: |-
          MaxMemoryMB bounds one job's in-heap solver memory; jobs needing more
          still run, backed by memory-mapped scratch files next to the patch store.
        type: integer
      max_patch_store_mb:
        description: |-
          MaxPatchStoreMB bounds the on-disk patch store size; oldest patches are
          evicted first when the cap is exceeded. 0 (default) means unlimited.
        type: integer
      max_release_size_mb:
        type: integer
      max_repair_ratio:
        description: |-
          MaxRepairRatio caps how large a fraction of a file's bytes a repair may
          reconstruct. The release's PAR2 redundancy is always the hard ceiling.
        type: number
      min_release_size_mb:
        description: |-
          MinReleaseSizeMB / MaxReleaseSizeMB bound the size of releases repair
          takes on (content bytes, PAR2 files excluded). A repair downloads the
          whole release once, so these let users skip releases too large to be
          worth the bandwidth or too small to bother with. 0 (default) means
          unbounded on that side — all sizes are repaired.
        type: integer
      patch_dir:
        description: |-
          PatchDir is where repaired article payloads (and the solver's transient
          scratch files) are stored. Empty (default) means <metadata_root>/patches.
          Applied at startup; changing it does not move existing patches.
        type: string
      repair_on_import:
        description: |-
          RepairOnImport queues a repair as soon as an import completes with
          confirmed missing segments, instead of waiting for the first playback or
          a health check. Off by default: every repair costs one full release
          download, so a large damaged backlog would be expensive. Worth enabling
          when your library outlives article retention — a release's PAR2 volumes
          are most likely to still be retrievable close to the post date.
        type: boolean
    type: object
  config.ProviderConfig:
    properties:
      account_expiration_date:
        type: string
      enabled:
        type: boolean
      host:
        type: string
      id:
        description: |-
          ID is a stable public identifier used in pool names, metrics, and errors.
          It must never contain credentials or non-graphic characters.
        type: string
      inflight_requests:
        description: |-
          InflightRequests caps concurrent decoded article bodies per connection (memory
          ceiling). In practice, the pool-wide ImportBudget caps total in-flight bodies
          to roughly the connection count, so each connection carries ~1 body. Peak observed
          depth is 3-4 against this cap of 10. Raising it does not improve import throughput.
        type: integer
      insecure_tls:
        type: boolean
      is_backup_provider:
        type: boolean
      keepalive_command:
        type: string
      keepalive_interval_seconds:
        type: integer
      last_rtt_ms:
        type: integer
      last_speed_test_mbps:
        type: number
      last_speed_test_time:
        type: string
      max_connections:
        type: integer
      min_connections_alive:
        type: integer
      name:
        type: string
      port:
        type: integer
      proxy_url:
        type: string
      max_article_age_days:
        description: >-
          How far back this provider's retention reaches, in days. Articles
          older than this are fetched from it only after every provider that
          does reach back that far. 0 means no limit.
        type: integer
      quota_bytes:
        type: integer
      quota_period_hours:
        type: integer
      skip_ping:
        type: boolean
      stat_inflight_requests:
        description: |-
          StatInflightRequests caps the per-connection STAT pipeline depth (bodyless
          existence checks). Its pool-wide aggregate (connections × depth, clamped to 4096)
          determines how much an idle-pool health sweep can widen: measured 24x sweep
          throughput improvement. While a stream is active the sweep is capped lower regardless.
        type: integer
      storage_group:
        type: string
      strict_max_article_age:
        description: >-
          Makes max_article_age_days binding rather than an ordering
          preference: the provider is not contacted at all for an article
          older than its retention.
        type: boolean
      stream_inflight_requests:
        description: |-
          StreamInflightRequests caps streaming (priority-lane) bodies in flight
          per connection, so a playback read never queues behind a connection's
          worth of read-ahead. 0 defaults to 4; values above inflight_requests
          are capped to it.
        type: integer
      tls:
        type: boolean
      user_agent:
        type: string
      username:
        type: string
    type: object
  config.ProwlarrConfig:
    properties:
      api_key:
        description: APIKey is the Prowlarr API key.
        type: string
      categories:
        description: |-
          Categories filters search results by Newznab category IDs.
          Defaults to 5000 (Movies), 5010 (Movies/Foreign), 5030 (TV), 5040 (TV/HD).
        items:
          type: integer
        type: array
      custom_scores:
        additionalProperties:
          type: integer
        description: |-
          CustomScores maps keyword/regex patterns to numeric scores (TRaSH guide style).
          Positive scores promote releases; negative scores demote them.
          Examples: {"2160p": 500, "REMUX": 300, "DV": -1000}
        type: object
      enabled:
        description: Enabled controls whether Prowlarr search is active for the Stremio
          addon.
        type: boolean
      exclude_keywords:
        description: |-
          ExcludeKeywords is an optional list of keywords/patterns; releases containing any are dropped.
          Examples: ["DV", "DoVi", "CAM", "TS", "TeleSync"]
        items:
          type: string
        type: array
      host:
        description: Host is the Prowlarr base URL (e.g. "http://localhost:9696").
        type: string
      indexers:
        description: |-
          Indexers optionally restricts searches to specific Prowlarr indexer IDs.
          Empty = search across all configured indexers.
        items:
          type: integer
        type: array
      languages:
        description: "Languages is an optional list of keywords; releases must contain
          at least one to pass.\nEmpty = no filtering. Examples: [\"Esp\", \"\U0001F1EA\U0001F1F8\",
          \"Spanish\", \"DUAL\"]"
        items:
          type: string
        type: array
      preferred_indexer_names:
        description: PreferredIndexerNames lists Prowlarr indexer names/keywords to
          prioritize and rank above others.
        items:
          type: string
        type: array
      preferred_indexers:
        description: PreferredIndexers lists Prowlarr indexer IDs to prioritize and
          rank above others.
        items:
          type: integer
        type: array
      preferred_languages:
        description: PreferredLanguages lists language keywords to prioritize and
          rank above others.
        items:
          type: string
        type: array
      qualities:
        description: |-
          Qualities is an optional list of keywords; releases must contain at least one to pass.
          Empty = no filtering. Examples: ["1080p", "HD", "4K", "3D"]
        items:
          type: string
        type: array
    type: object
  config.RCloneConfig:
    properties:
      allow_non_empty:
        type: boolean
      allow_other:
        description: Mount-Specific Settings
        type: boolean
      async_read:
        type: boolean
      attr_timeout:
        type: string
      buffer_size:
        type: string
      cache_dir:
        description: VFS Cache Settings
        type: string
      dir_cache_time:
        type: string
      gid:
        type: integer
      links:
        type: boolean
      log_level:
        type: string
      mount_enabled:
        description: Mount Configuration
        type: boolean
      mount_options:
        additionalProperties:
          type: string
        type: object
      no_checksum:
        type: boolean
      no_mod_time:
        description: Advanced Settings
        type: boolean
      path:
        description: RClone Path
        type: string
      rc_enabled:
        description: RC (Remote Control) Configuration
        type: boolean
      rc_options:
        additionalProperties:
          type: string
        type: object
      rc_pass:
        type: string
      rc_port:
        type: integer
      rc_url:
        type: string
      rc_user:
        type: string
      rcd_restart_after:
        description: |-
          RcdRestartAfter is how long the rcd subprocess must stay unresponsive to
          liveness probes before it is killed and restarted. Empty means the built-in
          default. Restarting is disruptive, because re-establishing the mount
          unmounts it out from under every process reading it, so an install whose
          rcd goes briefly slow under load can raise this to ride the stall out.
        type: string
      read_only:
        type: boolean
      syslog:
        type: boolean
      timeout:
        type: string
      transfers:
        type: integer
      uid:
        type: integer
      umask:
        type: string
      use_mmap:
        type: boolean
      vfs_cache_max_age:
        type: string
      vfs_cache_max_size:
        type: string
      vfs_cache_min_free_space:
        type: string
      vfs_cache_mode:
        type: string
      vfs_cache_poll_interval:
        type: string
      vfs_disk_space_total:
        type: string
      vfs_fast_fingerprint:
        type: boolean
      vfs_name:
        type: string
      vfs_read_ahead:
        type: string
      vfs_read_chunk_size:
        type: string
      vfs_read_chunk_size_limit:
        type: string
      vfs_read_chunk_streams:
        type: integer
    type: object
  config.RepairConfig:
    properties:
      auto_search_wait_seconds:
        description: |-
          AutoSearchWaitSeconds bounds how long a repair waits for the ARR's own
          automatic redownload search — queued by the ARR the moment a release is
          blocklisted — to finish before the file record is deleted and AltMount
          issues its own targeted search. 0 disables the wait and restores the
          previous fire-and-forget ordering.
        type: integer
      enabled:
        type: boolean
      exponential_backoff:
        type: boolean
      file_delete_confirm_seconds:
        description: |-
          FileDeleteConfirmSeconds bounds how long a repair waits for the ARR to
          report the deleted file record as unlinked before issuing its search.
        type: integer
      interval_minutes:
        type: integer
      max_cooldown_hours:
        type: integer
      max_repair_retries:
        type: integer
    type: object
  config.SABnzbdCategory:
    properties:
      dir:
        type: string
      name:
        type: string
      order:
        type: integer
      priority:
        type: integer
      type:
        description: '"sonarr" or "radarr"'
        type: string
    type: object
  config.SABnzbdConfig:
    properties:
      categories:
        items:
          $ref: '#/definitions/config.SABnzbdCategory'
        type: array
      complete_dir:
        type: string
      download_client_base_url:
        type: string
      enabled:
        type: boolean
      fallback_api_key:
        description: Masked in API responses
        type: string
      fallback_host:
        description: Fallback configuration for sending failed imports to external
          SABnzbd
        type: string
      history_retention_minutes:
        description: |-
          HistoryRetentionMinutes controls how far back the SABnzbd-emulating history
          endpoint looks into import_history when *arr clients poll without a specific
          nzo_id filter. Older entries are still returned when *arr asks for them by
          nzo_id. Defaults to 10080 (7 days).
        type: integer
    type: object
  config.SegmentCacheConfig:
    properties:
      cache_path:
        type: string
      enabled:
        type: boolean
      expiry_hours:
        description: |-
          ExpiryHours controls how long cached segments are kept before automatic
          eviction. Set to 0 to disable expiry (cache forever, bounded only by
          MaxSizeGB via LRU eviction). Left unset (nil) it defaults to 24 hours.
        type: integer
      max_size_gb:
        type: integer
      memory_mb:
        description: |-
          MemoryMB bounds the in-memory tier of decoded articles that sits in
          front of the disk cache and is on even when the disk cache is off.
          Left unset (nil) it defaults to 256; an explicit 0 disables it.
        type: integer
    type: object
  config.StreamScoringConfig:
    properties:
      custom_formats:
        items:
          $ref: '#/definitions/config.TrashCustomFormatConfig'
        type: array
      exclude_keywords:
        items:
          type: string
        type: array
      exclude_regex:
        type: string
      preferred_languages:
        items:
          type: string
        type: array
      preset:
        type: string
      require_preferred_language:
        type: boolean
    type: object
  config.StreamingConfig:
    properties:
      failure_masking:
        $ref: '#/definitions/config.FailureMaskingConfig'
      max_prefetch:
        type: integer
      read_timeout_seconds:
        description: |-
          ReadTimeoutSeconds bounds a single streaming read (WebDAV Read and FUSE
          ReadAt alike). Nothing below this layer carries a deadline the caller can
          observe: a segment fetch that stalls without erroring parks the read
          indefinitely, and on FUSE that means an uninterruptible D-state for the
          reading process. On expiry the in-flight reader is interrupted and the
          read fails, so the caller gets an EIO it can act on. 0 uses the built-in
          default; a negative value disables the timeout.
        type: integer
    type: object
  config.StremioConfig:
    properties:
      addon_description:
        description: AddonDescription is the description shown in Stremio's addon
          catalog.
        type: string
      addon_name:
        description: AddonName is the display name shown in Stremio's addon catalog.
        type: string
      base_url:
        description: |-
          BaseURL is the public base URL used when building Stremio stream links
          (e.g. "https://altmount.example.com"). Falls back to the auto-detected
          request origin when not set.
        type: string
      direct_stream:
        description: DirectStream when true streams NZB media segments directly.
        type: boolean
      enabled:
        description: |-
          Enabled controls whether the endpoint is active. Disabled by default.
          When false, the endpoint returns 404 Not Found.
        type: boolean
      failed_release_ttl_hours:
        description: |-
          FailedReleaseTTLHours controls how long a release that failed to import stays
          excluded from the Stremio stream list. Mirrors NzbTTLHours semantics: it filters
          failure records by age rather than deleting them, so it is bounded above by
          Import.FailedItemRetentionHours. Set to 0 to exclude for as long as the record
          survives. Defaults to 24 hours.
        type: integer
      fallback_timeout_ms:
        description: FallbackTimeoutMs is the timeout before attempting a fallback
          release.
        type: integer
      fast_fail_header_only:
        description: |-
          FastFailHeaderOnly when true causes Stremio-originated imports to fail fast
          immediately on the release-level probe when missing articles are detected,
          skipping the multi-part RAR per-file Stat sweep. Defaults to true.
        type: boolean
      include_library_streams:
        description: |-
          IncludeLibraryStreams when true checks and presents matching completed files
          from your Altmount library as instant 0s stream options in Stremio. Defaults to true.
        type: boolean
      indexers:
        allOf:
        - $ref: '#/definitions/config.StremioIndexersConfig'
        description: Indexers configures Prowlarr and direct Newsnab search providers.
      max_fallback_releases:
        description: |-
          MaxFallbackReleases caps how many *extra* releases a single play request may try
          after the first one fails. Set to 0 to disable fallback. Defaults to 2.
        type: integer
      max_retries:
        description: MaxRetries is the maximum number of retry attempts for stream
          fetching.
        type: integer
      nzb_ttl_hours:
        description: |-
          NzbTTLHours controls how long a completed NZB result is cached before
          the same NZB is re-processed on the next request.
          Set to 0 to disable expiry (cache forever). Defaults to 24 hours.
        type: integer
      prowlarr:
        allOf:
        - $ref: '#/definitions/config.ProwlarrConfig'
        description: Prowlarr configures the legacy Prowlarr indexer settings (retained
          for compatibility).
      scoring:
        allOf:
        - $ref: '#/definitions/config.StreamScoringConfig'
        description: Scoring configures TRaSH format scoring and exclusions.
      show_cached_indicator:
        description: ShowCachedIndicator when true shows cached badges in stream titles.
        type: boolean
      stream_ttl_seconds:
        description: StreamTTLSeconds is the stream cache expiration time in seconds.
        type: integer
    type: object
  config.StremioIndexersConfig:
    properties:
      custom_user_agent:
        type: string
      newsnab:
        items:
          $ref: '#/definitions/config.NewsnabIndexerConfig'
        type: array
      provider:
        description: '"prowlarr", "newsnab", "both"'
        type: string
      prowlarr:
        $ref: '#/definitions/config.ProwlarrConfig'
      user_agent_mode:
        type: string
    type: object
  config.StuckCleanupRule:
    properties:
      action:
        type: string
      enabled:
        type: boolean
      message:
        type: string
    type: object
  config.TrashCustomFormatConfig:
    properties:
      category:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      invert:
        type: boolean
      is_custom:
        type: boolean
      name:
        type: string
      pattern:
        type: string
      pattern_type:
        type: string
      score:
        type: integer
    type: object
  config.WebDAVConfig:
    properties:
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      user:
        type: string
    type: object
  database.HealthPriority:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - HealthPriorityNormal
    - HealthPriorityHigh
    - HealthPriorityNext
  database.HealthStatus:
    enum:
    - pending
    - checking
    - healthy
    - repair_triggered
    - corrupted
    - degraded
    type: string
    x-enum-comments:
      HealthStatusChecking: File is currently being checked
      HealthStatusCorrupted: File has missing segments or is corrupted
      HealthStatusDegraded: 'Missing segments only hit media payload: still playable,
        no repair'
      HealthStatusHealthy: File passed health check
      HealthStatusPending: File has not been checked yet
      HealthStatusRepairTriggered: File repair has been triggered in Arrs
    x-enum-descriptions:
    - File has not been checked yet
    - File is currently being checked
    - File passed health check
    - File repair has been triggered in Arrs
    - File has missing segments or is corrupted
    - 'Missing segments only hit media payload: still playable, no repair'
    x-enum-varnames:
    - HealthStatusPending
    - HealthStatusChecking
    - HealthStatusHealthy
    - HealthStatusRepairTriggered
    - HealthStatusCorrupted
    - HealthStatusDegraded
  database.QueuePriority:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-varnames:
    - QueuePriorityHigh
    - QueuePriorityNormal
    - QueuePriorityLow
  database.QueueStatus:
    enum:
    - pending
    - processing
    - completed
    - failed
    - paused
    - fallback
    - waiting_repair
    type: string
    x-enum-comments:
      QueueStatusFallback: Sent to external SABnzbd as fallback
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - ""
    - ""
    - Sent to external SABnzbd as fallback
    - ""
    x-enum-varnames:
    - QueueStatusPending
    - QueueStatusProcessing
    - QueueStatusCompleted
    - QueueStatusFailed
    - QueueStatusPaused
    - QueueStatusFallback
    - QueueStatusWaitingRepair
host: localhost:8080
info:
  contact:
    name: AltMount
    url: https://github.com/kipsilabs/altmount/issues
  description: REST API for AltMount — Usenet WebDAV server with NZB queue, health
    monitoring, ARR integration, FUSE/rclone mounting, and Stremio addon.
  license:
    name: MIT
  termsOfService: http://altmount.kipsilabs.top
  title: AltMount API
  version: "1.0"
paths:
  /arrs/download-client/register:
    post:
      description: Automatically registers AltMount as a download client (SABnzbd-compatible)
        in all configured ARR instances.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Register ARR download clients
      tags:
      - ARRs
  /arrs/download-client/test:
    post:
      description: Tests whether AltMount is reachable as a download client from all
        configured ARR instances.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Test ARR download clients
      tags:
      - ARRs
  /arrs/health:
    get:
      description: Returns health check results from all configured ARR instances.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get ARR health
      tags:
      - ARRs
  /arrs/instances:
    get:
      description: Returns all configured ARR instances.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: List ARR instances
      tags:
      - ARRs
  /arrs/instances/{type}/{name}:
    get:
      description: Returns a specific ARR instance by type and name.
      parameters:
      - description: Instance type (sonarr, radarr, lidarr, readarr, whisparr, or
          sportarr)
        in: path
        name: type
        required: true
        type: string
      - description: Instance name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get ARR instance
      tags:
      - ARRs
  /arrs/instances/test:
    post:
      consumes:
      - application/json
      description: Tests connectivity to an ARR instance with given credentials.
      parameters:
      - description: Instance connection details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.TestConnectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Test ARR connection
      tags:
      - ARRs
  /arrs/stats:
    get:
      description: Returns sync statistics for all configured ARR instances.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get ARR statistics
      tags:
      - ARRs
  /arrs/webhook:
    post:
      consumes:
      - application/json
      description: Receives file-import webhook events from ARR instances and triggers
        health checks. Authenticated via API key query parameter.
      parameters:
      - description: AltMount API key
        in: query
        name: apikey
        required: true
        type: string
      - description: Webhook payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ArrsWebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: ARR webhook receiver
      tags:
      - ARRs
  /arrs/webhook/register:
    post:
      description: Automatically registers AltMount as a webhook connection in all
        configured ARR instances.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Register ARR webhooks
      tags:
      - ARRs
  /auth/config:
    get:
      description: Returns authentication configuration (login required flag, available
        providers). Public endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Get auth config
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with username and password and returns a JWT access
        token. Rate-limited to 10/min per IP.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Login
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates the first admin user account. Only allowed when no users
        exist yet.
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Register
      tags:
      - Auth
  /auth/registration-status:
    get:
      description: Returns whether registration is currently open (i.e. no users exist
        yet).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Check registration status
      tags:
      - Auth
  /auth/reset-admin-password:
    post:
      consumes:
      - application/json
      description: Resets the password for a direct-auth user. Only available when
        login is disabled.
      parameters:
      - description: Reset credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ResetAdminPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Reset admin password
      tags:
      - Auth
  /config:
    get:
      description: Returns the current AltMount configuration with sensitive values
        masked.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.ConfigAPIResponse'
              type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get configuration
      tags:
      - Config
    put:
      consumes:
      - application/json
      description: Replaces the entire AltMount configuration. Triggers restart if
        required.
      parameters:
      - description: Complete configuration object
        in: body
        name: body
        required: true
        schema:
