          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Update queue item priority
      tags:
      - Queue
  /queue/{id}/retry:
    post:
      description: Resets a failed, pending, or completed queue item to pending so
        it is picked up by the worker pool.
      parameters:
      - description: Queue item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.QueueItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Retry queue item
      tags:
      - Queue
  /queue/bulk:
    delete:
      consumes:
      - application/json
      description: Deletes multiple queue items by ID. Cannot delete items currently
        being processed.
      parameters:
      - description: List of queue item IDs
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              items:
                type: integer
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Bulk delete queue items
      tags:
      - Queue
  /queue/bulk/cancel:
    post:
      consumes:
      - application/json
      description: Requests cancellation of multiple currently-processing queue items.
      parameters:
      - description: List of queue item IDs
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              items:
                type: integer
              type: array
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Bulk cancel queue items
      tags:
      - Queue
  /queue/bulk/priority:
    patch:
      consumes:
      - application/json
      description: Updates the priority for multiple queue items at once. Items currently
        being processed are skipped.
      parameters:
      - description: 'IDs and priority: 1=high, 2=normal, 3=low'
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              items:
                format: int64
                type: integer
              type: array
            priority:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  properties:
                    message:
                      type: string
                    skipped_count:
                      type: integer
                    updated_count:
                      type: integer
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Bulk update queue item priorities
      tags:
      - Queue
  /queue/bulk/restart:
    post:
      consumes:
      - application/json
      description: Resets multiple queue items to pending status for reprocessing.
      parameters:
      - description: List of queue item IDs
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              items:
                type: integer
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Bulk restart queue items
      tags:
      - Queue
  /queue/completed:
    delete:
      description: Removes all completed items from the queue.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Clear completed queue items
      tags:
      - Queue
  /queue/failed:
    delete:
      description: Removes all failed items from the queue.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Clear failed queue items
      tags:
      - Queue
  /queue/pending:
    delete:
      description: Removes all pending items from the queue.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Clear pending queue items
      tags:
      - Queue
  /queue/stats:
    get:
      description: Returns current queue statistics (counts by status, average processing
        time).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.QueueStatsResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get queue statistics
      tags:
      - Queue
  /queue/stats/history:
    get:
      description: Returns historical import statistics over a rolling window (last
        24h, 7d, 30d, 365d).
      parameters:
      - description: Number of days of history (default 1, max 365)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.QueueHistoricalStatsResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get historical queue statistics
      tags:
      - Queue
  /queue/test:
    post:
      consumes:
      - application/json
      description: Downloads a test NZB from sabnzbd.org and adds it to the queue
        for connectivity testing.
      parameters:
      - description: 'Size: 100MB, 1GB, or 10GB'
        in: body
        name: body
        required: true
        schema:
          properties:
            size:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.QueueItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Add test download to queue
      tags:
      - Queue
  /queue/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an NZB file and adds it to the download queue.
      parameters:
      - description: NZB file to upload (max 100MB)
        in: formData
        name: file
        required: true
        type: file
      - description: Optional category
        in: formData
        name: category
        type: string
      - description: Optional relative path under CompleteDir
        in: formData
        name: relative_path
        type: string
      - description: 'Priority: 1=high, 2=normal, 3=low'
        in: formData
        name: priority
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.QueueItemResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload NZB file to queue
      tags:
      - Queue
  /queue/upload-by-name:
    post:
      consumes:
      - application/json
      description: Searches for an NZB by name via the configured indexer and adds
        the result to the queue.
      parameters:
      - description: Search request
        in: body
        name: body
        required: true
        schema:
          properties:
            category:
              type: string
            name:
              type: string
            password:
              type: string
            priority:
              type: integer
            relative_path:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Search NZB by name and add to queue
      tags:
      - Queue
  /queue/upload-nzblnk:
    post:
      consumes:
      - application/json
      description: Resolves one or more nzblnk:// links and adds the resulting NZBs
        to the queue.
      parameters:
      - description: NZBLNK request (max 20 links)
        in: body
        name: body
        required: true
        schema:
          properties:
            category:
              type: string
            links:
              items:
                type: string
              type: array
            priority:
              type: integer
            relative_path:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Add NZBLnk links to queue
      tags:
      - Queue
  /stremio/{key}/manifest.json:
    get:
      description: Returns the Stremio addon manifest JSON for installation. The key
        authenticates the addon.
      parameters:
      - description: Download key (SHA256 of API key)
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.stremioManifest'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Stremio addon manifest
      tags:
      - Stremio
  /stremio/{key}/play:
    get:
      description: Downloads the NZB from Prowlarr by URL, queues it with high priority,
        waits for download completion, then redirects (302) to the first media stream
        URL.
      parameters:
      - description: Download key (SHA256 of API key)
        in: path
        name: key
        required: true
        type: string
      - description: Prowlarr NZB download URL
        in: query
        name: url
        required: true
        type: string
      - description: Safe filename title for the NZB
        in: query
        name: title
        type: string
      - description: Season number for selecting one episode from a season pack
        in: query
        name: season
        type: integer
      - description: Episode number for selecting one episode from a season pack
        in: query
        name: episode
        type: integer
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to media stream URL
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Play Stremio NZB stream
      tags:
      - Stremio
  /stremio/{key}/stream/{type}/{id}.json:
    get:
      description: Searches Prowlarr for matching NZBs and returns Stremio-compatible
        stream URL options.
      parameters:
      - description: Download key
        in: path
        name: key
        required: true
        type: string
      - description: Content type (movie or series)
        in: path
        name: type
        required: true
        type: string
      - description: Stremio content ID (e.g. tt1234567)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
      summary: Stremio stream handler
      tags:
      - Stremio
  /system/browse:
    get:
      description: Lists filesystem entries at a given path for directory/file picker
        UIs.
      parameters:
      - description: Directory path to browse (defaults to root)
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Browse filesystem
      tags:
      - System
  /system/cleanup:
    post:
      consumes:
      - application/json
      description: Removes old queue items and health records based on age. Supports
        dry-run mode.
      parameters:
      - description: Cleanup criteria
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.SystemCleanupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.SystemCleanupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: System cleanup
      tags:
      - System
  /system/health:
    get:
      description: Returns health status of all system components (database, workers,
        etc.).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.SystemHealthResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get system health
      tags:
      - System
  /system/pool/metrics:
    get:
      description: Returns download/upload metrics, speed, and per-provider connection
        statistics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.PoolMetricsResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get NNTP pool metrics
      tags:
      - System
  /system/provider-speed-history:
    get:
      description: Returns speed test history per provider over the given number of
        days.
      parameters:
      - description: 'Number of days to fetch data for (default: 30)'
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.ProviderSpeedTestHistoryResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get provider speed test history
      tags:
      - System
  /system/provider-stats:
    get:
      description: Returns aggregated data usage per provider over the given number
        of days.
      parameters:
      - description: 'Number of days to fetch data for (default: 30)'
        in: query
        name: days
        type: integer
      - description: Aggregation interval (daily, weekly, monthly, yearly)
        in: query
        name: interval
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.ProviderHistoricalStatsResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get provider historical data usage stats
      tags:
      - System
  /system/restart:
    post:
      consumes:
      - application/json
      description: Schedules a graceful system restart. Use force=true to skip safety
        checks.
      parameters:
      - description: Restart options
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.SystemRestartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.SystemRestartResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Restart system
      tags:
      - System
  /system/stats:
    get:
      description: Returns combined queue, health, and system information statistics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.SystemStatsResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get system statistics
      tags:
      - System
  /system/stats/reset:
    post:
      description: Resets accumulated system statistics counters (pool metrics, download
        counters).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Reset system statistics
      tags:
      - System
  /system/update/apply:
    post:
      consumes:
      - application/json
      description: Pulls the latest Docker image and restarts the container to apply
        the update.
      parameters:
      - description: Update channel (latest or dev)
        in: body
        name: body
        schema:
          properties:
            channel:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Apply update
      tags:
      - System
  /system/update/status:
    get:
      description: Checks Docker Hub for the latest available version and returns
        whether an update is available.
      parameters:
      - description: Release channel
        enum:
        - latest
        - dev
        in: query
        name: channel
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.UpdateStatusResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get update status
      tags:
      - System
  /user:
    get:
      description: Returns information about the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - User
  /user/api-key/regenerate:
    post:
      description: Generates a new API key for the authenticated user, invalidating
        the old one.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Regenerate API key
      tags:
      - User
  /user/logout:
    post:
      description: Invalidates the current session and JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - User
  /user/password:
    put:
      consumes:
      - application/json
      description: Changes the password for the currently authenticated user.
      parameters:
      - description: Password change request
        in: body
        name: body
        required: true
        schema:
          properties:
            current_password:
              type: string
            new_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - User
  /user/refresh:
    post:
      description: Issues a new JWT access token using the current valid token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.AuthResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.APIResponse'
      security:
      - BearerAuth: []
      summary: Refresh token
      tags:
      - User
securityDefinitions:
  ApiKeyAuth:
    in: query
    name: apikey
    type: apiKey
swagger: "2.0"
tags:
- description: NZB download queue management
  name: Queue
- description: File health monitoring and repair
  name: Health
- description: File metadata, streams, and NZB export
  name: Files
- description: Manual file imports and directory scanning
  name: Import
- description: NNTP provider management
  name: Providers
- description: Sonarr/Radarr integration
  name: ARRs
- description: Configuration management
  name: Config
- description: System stats, health, and maintenance
  name: System
- description: FUSE mount management
  name: FUSE
- description: Stremio addon and NZB stream endpoints
  name: Stremio
- description: Authentication and registration
  name: Auth
- description: Current user management
  name: User
